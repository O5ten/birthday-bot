name: Congratulations

on:
  schedule:
    - cron: '37 6 * * *'
      timezone: "Europe/Stockholm"
  workflow_dispatch:

jobs:
  congratulate:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait until 07:00 Stockholm time
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Europe/Stockholm date -d "today 07:00" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target - now)) seconds"
            sleep $((target - now))
          fi

      - name: Skip if too late
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          latest=$(TZ=Europe/Stockholm date -d "today 07:30" +%s)
          if [ "$now" -gt "$latest" ]; then
            echo "Started too late, skipping today's post"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Groovy
        uses: wtfjoke/setup-groovy@v2
        with:
          groovy-version: '4.x'

      - name: Congratulate
        run: groovy congratulations.groovy
        env:
          PERSONAL_DATA: ${{ vars.PERSONAL_DATA }}
          BOT_BEARER_TOKEN: ${{ secrets.BOT_BEARER_TOKEN }}
