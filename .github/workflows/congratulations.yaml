name: Congratulations

# Triggered every morning by cron-job.org through the workflow_dispatch API
# with inputs.scheduled=true (GitHub's own cron ran hours late).
# A manual run from the Actions tab leaves scheduled=false and skips the time guards.
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Set by cron-job.org; enables the 07:00-07:30 time window'
        type: boolean
        default: false

jobs:
  congratulate:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait until 07:00 Stockholm time
        if: inputs.scheduled
        run: |
          target=$(TZ=Europe/Stockholm date -d "today 07:00" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target - now)) seconds"
            sleep $((target - now))
          fi

      - name: Skip if too late
        if: inputs.scheduled
        run: |
          now=$(date +%s)
          latest=$(TZ=Europe/Stockholm date -d "today 07:30" +%s)
          if [ "$now" -gt "$latest" ]; then
            echo "Started too late, skipping today's post"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Groovy
        uses: wtfjoke/setup-groovy@v2
        with:
          groovy-version: '4.x'

      - name: Congratulate
        run: groovy congratulations.groovy
        env:
          PERSONAL_DATA: ${{ vars.PERSONAL_DATA }}
          BOT_BEARER_TOKEN: ${{ secrets.BOT_BEARER_TOKEN }}
