name: Congratulations

on:
  schedule:
    - cron: '37 6 * * *'          # trigger ~23 min early, off the busy :00 slot
      timezone: "Europe/Stockholm"
  workflow_dispatch:

jobs:
  congratulate:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait until 07:00 Stockholm time
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Europe/Stockholm date -d "today 07:00" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target - now)) seconds"
            sleep $((target - now))
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Groovy
        uses: wtfjoke/setup-groovy@v2
        with:
          groovy-version: '4.x'

      - run: groovy congratulations.groovy
        env:
